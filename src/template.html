<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>내분비학 기출 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1f2633;--mute:#6b7385;--line:#e3e6ee;--pri:#1d3c6e;--pri2:#e8eef8;--ok:#2e7d4f;--okbg:#eaf6ef;--bad:#b3362f;--badbg:#fbecea;--var:#7a4bb3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.6}
header{background:var(--pri);color:#fff;padding:14px 18px}header h1{font-size:18px;margin:0}header p{margin:2px 0 0;font-size:12.5px;opacity:.8}
main{max-width:820px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:12.5px;color:var(--mute);margin:10px 0 6px;font-weight:500}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
button.go{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px;font-weight:700;cursor:pointer}
button.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-bottom:8px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--pri)}
.tags span{display:inline-block;font-size:11.5px;background:var(--pri);color:#fff;border-radius:4px;padding:0 6px;margin-right:4px}
.tags span.v{background:var(--var)}.tags span.g{background:#eef1f6;color:var(--mute)}
.stem{margin:10px 0}.stem div{margin:2px 0}
.lab{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;background:#f6f7f9;border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:6px 0;font-size:13.5px}
@media(max-width:560px){.lab{grid-template-columns:1fr}}
table.dt{border-collapse:collapse;margin:8px auto;font-size:13px}table.dt td,table.dt th{border:1px solid var(--line);padding:3px 8px;text-align:center}table.dt th{background:var(--pri2)}table.dt caption{caption-side:bottom;font-size:12px;color:var(--mute)}
.img{text-align:center;margin:8px 0}.img img{max-width:100%;max-height:360px;border-radius:6px;border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:7px 0;font-size:14.5px;cursor:pointer;color:var(--ink);font-family:inherit;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--pri)}.opt b{color:var(--pri);margin-right:6px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt:disabled{cursor:default;opacity:1}
.ex{border-left:4px solid var(--ok);background:var(--okbg);border-radius:6px;padding:10px 12px;margin-top:10px;font-size:14px}
.ex.wrong{border-color:var(--bad);background:var(--badbg)}
.ex .h{font-weight:700;margin-bottom:4px}.ex .src{font-size:12px;color:var(--mute);margin-top:6px}.ex .note{font-size:12.5px;color:var(--bad);margin-top:4px}
.nav{display:flex;justify-content:space-between;margin-top:14px;gap:8px}
.score{font-size:30px;font-weight:700;color:var(--pri)}
.wl{font-size:13.5px}.wl div{padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}.wl div:hover{color:var(--pri)}
.small{font-size:12.5px;color:var(--mute)}
</style></head><body>
<header><h1>내분비학 기출 퀴즈</h1><p>2020–2025 복원 기출 200문항 + 예상 변형 45문항 · 정답·해설은 26 학습부 기준</p></header>
<main id="app"></main>
<script id="data" type="application/json">__DATA__</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const CIR='①②③④⑤';
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let wrong=new Set(LS.get('endo_wrong',[]));
const st={chs:new Set(D.ch.map(c=>c.id)),kind:'all',order:'shuffle',n:20};
let run=null;
const $=s=>document.querySelector(s);const app=$('#app');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pool(){let q=D.q.filter(x=>st.chs.has(x.ch));
 if(st.kind==='past')q=q.filter(x=>!x.v);if(st.kind==='var')q=q.filter(x=>x.v);if(st.kind==='wrong')q=q.filter(x=>wrong.has(x.id));return q}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function home(){
 const p=pool();
 app.innerHTML=`<div class="panel"><div class="lbl">파트 (2026 담당)</div><div class="row" id="chs">
 <button class="chip ${st.chs.size===D.ch.length?'on':''}" data-all>전체</button>${D.ch.map(c=>`<button class="chip ${st.chs.has(c.id)?'on':''}" data-c="${c.id}">${esc(c.title.replace(/^[^.]+\.\s*/,''))} · ${esc(c.prof)}</button>`).join('')}</div>
 <div class="lbl">문제 종류</div><div class="row" id="kind">${[['all','기출+변형'],['past','기출만'],['var','예상 변형만'],['wrong',`오답노트 (${wrong.size})`]].map(([k,t])=>`<button class="chip ${st.kind===k?'on':''}" data-k="${k}">${t}</button>`).join('')}</div>
 <div class="lbl">순서 · 문항 수</div><div class="row" id="ord">${[['shuffle','무작위'],['seq','문제집 순서']].map(([k,t])=>`<button class="chip ${st.order===k?'on':''}" data-o="${k}">${t}</button>`).join('')}
 <span style="width:12px"></span>${[10,20,50,0].map(n=>`<button class="chip ${st.n===n?'on':''}" data-n="${n}">${n||'전부'}</button>`).join('')}</div>
 <div class="row" style="margin-top:16px;justify-content:space-between"><span class="small">선택된 문항 ${p.length}개</span><button class="go" id="start" ${p.length?'':'disabled'}>시작</button></div></div>
 <div class="panel small">기출 문항의 연도 태그는 같은 선지·정답으로 출제된 해를 모두 표시합니다. 보라색 <b style="color:var(--var)">변형</b> 문항은 기출을 바탕으로 조건·선지를 바꾼 예상 문제입니다. 틀린 문제는 이 브라우저의 오답노트에 저장됩니다.</div>`;
 app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=+b.dataset.c;if(st.chs.size===D.ch.length){st.chs=new Set([c])}else{st.chs.has(c)?st.chs.delete(c):st.chs.add(c);if(!st.chs.size)st.chs=new Set(D.ch.map(c=>c.id))}home()});
 app.querySelector('[data-all]').onclick=()=>{st.chs=new Set(D.ch.map(c=>c.id));home()};
 app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{st.kind=b.dataset.k;home()});
 app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{st.order=b.dataset.o;home()});
 app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{st.n=+b.dataset.n;home()});
 $('#start').onclick=()=>{let q=st.order==='shuffle'?shuffle(p):p;if(st.n)q=q.slice(0,st.n);run={q,i:0,ans:{}};show()};
}
function tags(x){if(x.v)return `<span class="v">변형</span><span class="g">${esc(x.N)}</span>`;return x.keys.map(k=>`<span>20${k.slice(0,2)} #${k.slice(3).replace('-1','')}</span>`).join('')+`<span class="g">${esc(x.g)}</span>`}
function show(){
 const x=run.q[run.i],a=run.ans[x.id];const done=a!==undefined;
 app.innerHTML=`<div class="panel"><div class="top"><span>${run.i+1} / ${run.q.length}</span><span>맞힌 문제 ${Object.entries(run.ans).filter(([id,v])=>v===run.q.find(q=>q.id===id).a).length}</span></div>
 <div class="bar"><i style="width:${(run.i+1)/run.q.length*100}%"></i></div>
 <div class="tags">${tags(x)}</div><div class="stem">${x.stem}</div>
 ${x.img.map(s=>`<div class="img"><img src="${s}" alt="문항 그림"></div>`).join('')}
 <div>${x.o.map((o,i)=>`<button class="opt ${done?(i===x.a?'ok':(i===a?'bad':'')):''}" data-i="${i}" ${done?'disabled':''}><b>${CIR[i]}</b>${esc(o)}</button>`).join('')}</div>
 ${done?`<div class="ex ${a===x.a?'':'wrong'}"><div class="h">${a===x.a?'정답':'오답'} · 정답 ${x.v?CIR[x.a]:esc(x.A)}</div><div>${esc(x.E)}</div>${x.N&&!x.v?`<div class="note">※ ${esc(x.N)}</div>`:''}<div class="src">근거: ${esc(x.B)}</div></div>`:''}
 <div class="nav"><button class="ghost" id="home">처음으로</button><span><button class="ghost" id="prev" ${run.i?'':'disabled'}>이전</button> <button class="go" id="next" ${done?'':'disabled'}>${run.i+1<run.q.length?'다음':'결과 보기'}</button></span></div></div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;run.ans[x.id]=i;if(i===x.a)wrong.delete(x.id);else wrong.add(x.id);LS.set('endo_wrong',[...wrong]);show()});
 $('#home').onclick=home;$('#prev').onclick=()=>{run.i--;show()};
 $('#next').onclick=()=>{if(run.i+1<run.q.length){run.i++;show();scrollTo(0,0)}else result()};
}
function result(){
 const ok=run.q.filter(x=>run.ans[x.id]===x.a);const bad=run.q.filter(x=>run.ans[x.id]!==x.a);
 app.innerHTML=`<div class="panel"><div class="score">${ok.length} / ${run.q.length}</div><div class="small">틀린 문제는 오답노트에 저장되었습니다.</div>
 ${bad.length?`<div class="lbl">틀린 문제 (눌러서 다시 보기)</div><div class="wl">${bad.map(x=>`<div data-id="${x.id}">${x.v?'[변형] ':''}${esc(x.stem.replace(/<[^>]+>/g,' ').slice(0,70))}…</div>`).join('')}</div>`:''}
 <div class="nav"><button class="ghost" id="home">처음으로</button>${bad.length?'<button class="go" id="retry">틀린 문제만 다시</button>':''}</div></div>`;
 $('#home').onclick=home;
 if(bad.length){$('#retry').onclick=()=>{run={q:shuffle(bad),i:0,ans:{}};show()};
 app.querySelectorAll('.wl div').forEach(d=>d.onclick=()=>{run.i=run.q.findIndex(q=>q.id===d.dataset.id);show()})}
}
home();
</script></body></html>
